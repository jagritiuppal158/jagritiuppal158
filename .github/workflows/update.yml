name: Update README

on:
schedule:
- cron: "0 */6 * * *"
workflow_dispatch:

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v3

  - name: Update README timestamp
    run: |
      echo "Last Updated: $(date)" > updated.txt

  - name: Commit changes
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add .
      git commit -m "Auto update by GitHub Actions" || exit 0
      git push
```
